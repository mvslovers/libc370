# Publish a GitHub release for a v* tag (#249, #326).
#
# 1. The cc370 to build with is the release sdk/cc370.json names as the
#    minimum (tag v<min>), not cc370 main: the artifacts must be reproducible
#    from released tools, and they are checked against the oldest compiler
#    they claim to support.
# 2. build.yml, unchanged otherwise: the tag has to build, pass the host
#    tests, and produce packages that pass sdk/checkpkg.sh.  Its package job
#    makes the artifacts with the tag's version.
# 3. VERSION has to equal the tag without its "v".  `release: vX.Y.Z` commits
#    set it, so a mismatch means the tag sits on the wrong commit.
# 4. The notes are the tag's CHANGELOG.md section (sdk/changelog-section.py),
#    then the cc370 requirement - derived from sdk/cc370.json, the one place
#    it is written - and the cc370 the build used.  A tag without a section
#    fails here, so no release goes out without notes.
# 5. If the release already exists (made by hand, with curated notes, as
#    v1.0.7 was), its notes are left exactly as they are; the artifacts are
#    attached either way.
#    The manuals (ML01-0003, ML01-0004) are built from the tag by build.yml's
#    `books` job and attached beside the packages as ml01-000N-E.pdf, with
#    their lines added to SHA256SUMS.
# 6. Then pair.yml installs this release beside cc370's latest, as packages,
#    under apt and dnf, and builds a program with the pair.
# 7. And the Homebrew formula: sdk/homebrew/libc370.rb.in rendered with the
#    version and the sysroot tarball's sha256 from the release's own
#    SHA256SUMS, pushed to mvslovers/homebrew-tap (cc370#699).  Only a v* tag
#    reaches the `release` environment that holds the tap's deploy key.  The
#    commit is "libc370 <version>" by github-actions[bot], as cc370's are;
#    an unchanged formula is not committed.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  requires:
    runs-on: ubuntu-latest
    outputs:
      min: ${{ steps.req.outputs.min }}
      version: ${{ steps.req.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: The minimum cc370
        id: req
        run: |
          min=$(python3 -c 'import json; print(json.load(open("sdk/cc370.json"))["min"])')
          echo "min=$min" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: requires
    uses: ./.github/workflows/build.yml
    with:
      cc370_ref: v${{ needs.requires.outputs.min }}
      version: ${{ needs.requires.outputs.version }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: VERSION matches the tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(cat VERSION)"
          if [ "$have" != "$want" ]; then
            echo "::error::VERSION is '$have', the tag says '$want'"
            exit 1
          fi

      - name: The artifacts
        uses: actions/download-artifact@v4
        with:
          name: libc370-dist
          path: dist

      # the manuals, built from the tag by build.yml's books job, beside the
      # packages and in SHA256SUMS (ml01-0003-E.pdf, ml01-0004-E.pdf)
      - name: The manuals
        uses: actions/download-artifact@v4
        with:
          name: books
          path: dist

      - name: The manuals in SHA256SUMS
        run: |
          cd dist
          ls ml01-*.pdf >/dev/null
          sha256sum ml01-*.pdf >> SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Release notes
        run: |
          python3 sdk/changelog-section.py "${GITHUB_REF_NAME#v}" > notes.md
          {
            printf '\n---\n%s ' "$(python3 sdk/package.py requires notes)"
            printf 'Built with cc370 %s.\n' \
              "${{ needs.build.outputs.cc370_version }}"
          } >> notes.md

      - name: Create the release, attach the artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME exists; its notes are left as they are."
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "libc370 $GITHUB_REF_NAME" --notes-file notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" --clobber dist/*

  pair:
    needs: [requires, release]
    uses: ./.github/workflows/pair.yml
    with:
      libc370: ${{ needs.requires.outputs.version }}

  homebrew:
    needs: [requires, release]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Render Formula/libc370.rb
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" -p SHA256SUMS -O sums
          v="${{ needs.requires.outputs.version }}"
          s=$(grep "  libc370-$v-sysroot.tar.gz\$" sums | cut -d' ' -f1)
          [ -n "$s" ] || { echo "::error::sysroot tarball not in SHA256SUMS"; exit 1; }
          sed -e "s/@VERSION@/$v/g" -e "s/@SHA256@/$s/" \
            sdk/homebrew/libc370.rb.in > libc370.rb
          ! grep -n '@[A-Z0-9]*@' libc370.rb
          ruby -c libc370.rb

      - name: Push it to mvslovers/homebrew-tap
        env:
          TAP_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$TAP_KEY" > ~/.ssh/tap && chmod 600 ~/.ssh/tap
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap -o IdentitiesOnly=yes"
          git clone -q git@github.com:mvslovers/homebrew-tap.git tap
          cp libc370.rb tap/Formula/libc370.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/libc370.rb
          v="${{ needs.requires.outputs.version }}"
          if git diff --cached --quiet; then echo "already at $v"
          else git commit -qm "libc370 $v" && git push -q origin HEAD:main; fi
          rm -f ~/.ssh/tap
