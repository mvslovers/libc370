# Build libc370 on every PR and every push to main (#249).
#
# Two jobs:
#
# build (Linux)  builds cc370 from its main and caches the install, keyed on
#   the cc370 commit alone: a libc370 change must not invalidate a compiler
#   that did not change.  mbt's reusable build.yml puts both SHAs in its key
#   because it installs libc370 into the same prefix; this job builds libc370
#   from the checkout and never installs it.  The cache is saved right after
#   the install, not at the end of the job, so a later failure does not
#   rebuild GCC on the next run.
#   Fails on a compile error, or an as370 return code other than 0:
#   sdk/mklibc.py stops on both, since #32 showed that an object as370
#   flagged is a wrong object, not a warning.  Reports the compiler warning
#   count in the job summary; that becomes a gate once #39 step 3 has made
#   -Wall usable.
#
# host-tests (macOS)  test/host/run.sh, which needs no cc370 at all.  It runs
#   on macOS because the host tests cannot link on Linux: the libc370 headers
#   name symbols with asm("@@ARCOU") labels, and in ELF "@@" is the
#   default-version separator, so every such name becomes an empty symbol and
#   they all collide ("multiple definition of `no symbol'").  Mach-O has no
#   symbol versioning, and macOS is where the tests are written.
#
# Also called by release.yml, so a release is built the same way.
#
# 2.0 (#256): pushes to the integration branch 2.0 build too, and a PR into
# 2.0 must pass sdk/gate.py against its base -- identical assembler for every
# TU, identical archive, no new warning, unless sdk/gate-allow.txt names the
# difference.  sdk/headermap.py check keeps the mapping, the design doc and
# include/ in step on every build.

name: Build

on:
  push:
    branches: [main, "2.0"]
  pull_request:
  workflow_call:
    outputs:
      cc370_sha:
        description: "cc370 commit the library was built with"
        value: ${{ jobs.build.outputs.cc370_sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      cc370_sha: ${{ steps.cc370.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0          # sdk/gate.py checks out the PR's base

      - name: Header map
        run: python3 sdk/headermap.py check

      - name: Clone cc370
        id: cc370
        run: |
          git clone --depth 1 --branch main \
            https://github.com/mvslovers/cc370.git /tmp/cc370
          echo "sha=$(git -C /tmp/cc370 rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore cc370
        id: cc370-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.local
          key: cc370-only-${{ runner.os }}-${{ steps.cc370.outputs.sha }}

      - name: Build and install cc370
        if: steps.cc370-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex
          make -C /tmp/cc370 install PREFIX="$HOME/.local"

      - name: Save cc370
        if: steps.cc370-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.local
          key: cc370-only-${{ runner.os }}-${{ steps.cc370.outputs.sha }}

      - name: Add cc370 to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build libc370
        run: |
          set -o pipefail
          make build 2>&1 | tee build.log

      - name: Gate (PRs into 2.0)
        if: github.event_name == 'pull_request' && github.base_ref == '2.0'
        run: |
          set -o pipefail
          python3 sdk/gate.py ${{ github.event.pull_request.base.sha }} 2>&1 | tee gate.log

      - name: Report
        if: always()
        run: |
          warn=$(sed -n 's/^\[libc\] \([0-9]*\) compiler warning(s):$/\1/p' build.log 2>/dev/null)
          {
            echo "### libc370 build"
            echo "- cc370: \`${{ steps.cc370.outputs.sha }}\`"
            echo "- compiler warnings: ${warn:-0}"
            grep -E '^\[libc\] (OK|no duplicate)' build.log 2>/dev/null | sed 's/^/- /'
            if [ -f gate.log ]; then
              echo "#### gate"
              echo '```'
              cat gate.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  host-tests:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Host tests
        run: make test-host
