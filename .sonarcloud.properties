# SonarQube Cloud Automatic Analysis settings. SonarQube Cloud reads this
# file from the default branch.

# libc370 runs on MVS 3.8j (S/370), compiled by cc370: big-endian, int, long
# and pointers 32 bits, char unsigned, 24-bit addresses. Clang has no 32-bit
# S/370 target (systemz/s390x are 64-bit only), so use the closest ILP32
# one: 32-bit PowerPC, big-endian with unsigned char, bare-metal EABI for
# cc370's size_t and ptrdiff_t (unsigned long / long) and no OS macros.
# The same triple as brexx370's .sonarcloud.properties and mbt's compiledb.
sonar.cfamily.customTargetArch=powerpc
sonar.cfamily.customTargetVendor=unknown
sonar.cfamily.customTargetSystem=unknown
sonar.cfamily.customTargetEnv=eabi

# cc370 predefines __MVS__ and __CC370__ (MAJOR*10000 + MINOR*100 + PATCH).
# __MVS__ selects the code paths the MVS build compiles; every public header
# then #errors without a __CC370__ of at least sdk/cc370.json's minimum
# (include/sys/_cc370.h), so it is defined as that minimum, 1.1.0.
sonar.cfamily.customPreprocessor=#define __MVS__ 1\n#define __CC370__ 10100\n

# What is built: src/ and include/; sdk/ is the build tooling (Python).
# attic/ is kept but not built; sysmac/ and maclib/ are assembler macros.
sonar.sources=src,include,sdk
sonar.tests=test
sonar.exclusions=attic/**,sysmac/**,maclib/**

# Not settable in Automatic Analysis: include directories. The sources
# include public headers as <...> from include/ and private ones by their
# path from the root ("src/internal/..."); whether the analyzer resolves
# both is for the first analysis to show.

# One encoding for every file, and the sources are Latin-1 or UTF-8 -
# cc370 and as370 decide per file (valid UTF-8 as UTF-8, anything else as
# Latin-1), and the macros carry Latin-1 (e.g. the not-sign in sysmac/).
# Under ISO-8859-1 every byte decodes, so the analysis cannot fail on any of
# them; the analyzed C sources are plain ASCII.  sdk/ uses no
# version-specific Python; it runs on ubuntu-latest's python3 (3.12) and on
# the maintainer's 3.14.
sonar.sourceEncoding=ISO-8859-1
sonar.python.version=3.12, 3.13, 3.14
